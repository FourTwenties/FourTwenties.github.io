<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>FileShare Pro</title>
  <style>
    body { font-family: sans-serif; background:#0f1220; color:#eaf0ff; margin:0; padding:20px; }
    .card { background:rgba(255,255,255,0.06); padding:16px; border-radius:12px; margin-bottom:16px; }
    .btn { padding:10px 14px; border:none; border-radius:8px; cursor:pointer; }
    .btn.primary { background:#4a6cfa; color:#fff; }
    .log { background:rgba(0,0,0,0.3); min-height:120px; padding:10px; border-radius:8px; font-family:monospace; }
  </style>
</head>
<body>
  <h1>FileShare Pro</h1>

  <div class="card">
    <label>Display name</label>
    <input id="displayName" placeholder="Mystery's Device"/>
    <button id="goOnlineBtn" class="btn primary">Go online</button>
    <button id="goOfflineBtn" class="btn">Go offline</button>
    <p id="statusMsg">Status: Ready</p>
  </div>

  <div class="card">
    <h3>Available peers</h3>
    <ul id="peerList"></ul>
  </div>

  <div class="card">
    <h3>Logs</h3>
    <div id="log" class="log"></div>
    <button id="clearLog" class="btn">Clear</button>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <script>
    // --- Firebase config (replace with your own project values) ---
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- State ---
    const selfId = Math.random().toString(36).slice(2,10);
    let presenceRef = null;

    // --- UI helpers ---
    const logEl = document.getElementById('log');
    function log(...args){
      const s = args.join(' ');
      console.log('[FS]', ...args);
      logEl.textContent += s + "\n";
      logEl.scrollTop = logEl.scrollHeight;
    }
    function setStatus(s){ document.getElementById('statusMsg').textContent = 'Status: ' + s; log(s); }

    // --- Presence ---
    document.getElementById('goOnlineBtn').onclick = async () => {
      const name = document.getElementById('displayName').value || 'Anonymous';
      presenceRef = db.ref('presence/' + selfId);
      await presenceRef.set({ id:selfId, name, ts: Date.now() });
      presenceRef.onDisconnect().remove();
      setStatus('Online as ' + name);
      subscribePresence();
    };

    document.getElementById('goOfflineBtn').onclick = async () => {
      if(presenceRef) await presenceRef.remove();
      setStatus('Offline');
      document.getElementById('peerList').innerHTML = '';
    };

    function subscribePresence(){
      const peerList = document.getElementById('peerList');
      peerList.innerHTML = '';
      db.ref('presence').on('child_added', snap => {
        const peer = snap.val();
        if(!peer || peer.id === selfId) return;
        const li = document.createElement('li');
        li.textContent = peer.name + ' (' + peer.id + ')';
        peerList.appendChild(li);
      });
      db.ref('presence').on('child_removed', snap => {
        const el = Array.from(peerList.children).find(li => li.textContent.includes(snap.key));
        if(el) el.remove();
      });
    }

    document.getElementById('clearLog').onclick = () => { logEl.textContent = ''; };
  </script>
</body>
</html>
