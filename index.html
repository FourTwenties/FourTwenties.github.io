<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FileShare Pro - UI Preview</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* === GLOBAL STYLES & VARIABLES === */
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', system-ui, sans-serif; }
    :root {
      --primary:#4a6cfa; --primary-dark:#2d4bcc; --secondary:#ff6b6b;
      --success:#20c997; --warning:#ff922b; --dark:#1a1d28; --darker:#131620;
      --light:#f8f9fa; --gray:#6c757d; --surface:#252a3f; --surface-light:#2e344e;
      --card-bg:rgba(255,255,255,0.05); --card-border:rgba(255,255,255,0.1);
    }
    body { background:linear-gradient(135deg,var(--darker),var(--dark)); color:var(--light); min-height:100vh; padding:20px; line-height:1.6; }
    .container { max-width:1200px; margin:0 auto; }

    header { display:flex; justify-content:space-between; align-items:center; padding:20px 0; margin-bottom:30px; }
    .logo { display:flex; align-items:center; gap:12px; font-size:1.8rem; font-weight:700; }
    .logo i { color:var(--primary); }
    nav a { color:var(--light); margin:0 10px; text-decoration:none; font-weight:600; }

    .quick-actions { display:flex; justify-content:center; gap:20px; margin:30px 0; flex-wrap:wrap; }
    .action-btn { display:flex; flex-direction:column; align-items:center; gap:10px; width:100px; padding:20px 10px; border-radius:20px; background:var(--card-bg); border:1px solid var(--card-border); cursor:pointer; transition:all 0.3s ease; }
    .action-btn:hover { background:var(--surface-light); transform:translateY(-5px); }
    .action-icon { width:50px; height:50px; border-radius:50%; background:var(--primary); display:flex; align-items:center; justify-content:center; font-size:1.5rem; }
    .action-label { font-weight:500; font-size:0.9rem; }

    .section-title { font-size:1.5rem; margin:30px 0 20px; display:flex; align-items:center; gap:10px; }
    .files-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:20px; }
    .file-card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:15px; padding:20px; transition:all 0.3s ease; cursor:pointer; }
    .file-card:hover { background:var(--surface-light); transform:translateY(-3px); }
    .file-header { display:flex; align-items:center; gap:15px; margin-bottom:15px; }
    .file-icon { width:50px; height:50px; border-radius:12px; background:var(--primary); display:flex; align-items:center; justify-content:center; font-size:1.5rem; }
    .file-info { flex:1; }
    .file-name { font-weight:600; margin-bottom:5px; }
    .file-meta { color:var(--gray); font-size:0.85rem; }
    .progress-container { background:rgba(255,255,255,0.1); border-radius:10px; height:8px; overflow:hidden; }
    .progress-bar { background:var(--primary); height:100%; border-radius:10px; }

    footer { text-align:center; margin-top:40px; font-size:0.9rem; color:var(--gray); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo"><i class="fas fa-share-alt"></i> FileShare Pro</div>
      <nav>
        <a href="#">Home</a>
        <a href="#">Files</a>
        <a href="#">Settings</a>
        <a href="#">About</a>
      </nav>
    </header>

    <!-- Quick Actions -->
    <div class="quick-actions">

      <div class="action-btn"><div class="action-icon"><i class="fas fa-download"></i></div><span class="action-label">Receive</span></div>
      <div class="action-btn"><div class="action-icon"><i class="fas fa-users"></i></div><span class="action-label">Group</span></div>
      <div class="action-btn"><div class="action-icon"><i class="fas fa-tools"></i></div><span class="action-label">Tools</span></div>
      <div class="action-btn"><div class="action-icon"><i class="fas fa-shield-alt"></i></div><span class="action-label">Security</span></div>
    </div>

        <div class="progress-container"><div class="progress-bar" style="width:65%"></div></div>
      </div>
      <div class="file-card">

          <div class="file-info"><div class="file-name">Design_Assets</div><div class="file-meta">180 MB • Folder</div></div>
        </div>
        <div class="progress-container"><div class="progress-bar" style="width:45%"></div></div>
      </div>
    </div>

      <div class="action-btn"><div class="action-icon" style="background:#ff6b6b;"><i class="fas fa-bluetooth-b"></i></div><span class="action-label">Bluetooth 5.3</span></div>
