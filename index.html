<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FileShare Pro — Connectivity Test (Minimal)</title>
  <style>
    body { margin:0; font-family:system-ui, Arial; background:#0f1220; color:#eef1f7; padding:20px; }
    .card { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:14px; padding:16px; margin-bottom:16px; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    input, button { padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.08); color:#eef1f7; }
    button { cursor:pointer; border: none; background:#4a6cfa; }
    button.secondary { background:transparent; border:1px solid #4a6cfa; color:#4a6cfa; }
    .pill { display:inline-block; padding:6px 10px; border-radius:999px; background:rgba(255,255,255,0.1); margin-right:8px; }
    ul { list-style:none; padding:0; margin:0; }
    li { display:flex; justify-content:space-between; align-items:center; padding:8px; border-radius:10px; background:rgba(255,255,255,0.08); margin-bottom:8px; }
    #log { white-space:pre-wrap; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background:rgba(0,0,0,0.35); padding:12px; border-radius:10px; min-height:120px; }
  </style>
</head>
<body>
  <h2>FileShare Pro — Connectivity Test</h2>
  <div class="card">
    <div class="row">
      <div>
        <label>Display name</label>
        <input id="displayName" placeholder="Mystery's Device"/>
      </div>
      <div style="display:flex; gap:8px; align-items:flex-end;">
        <button id="goOnline">Go online</button>
        <button id="goOffline" class="secondary">Go offline</button>
      </div>
    </div>
    <p><span class="pill" id="connState">Connection: Disconnected</span><span class="pill" id="iceState">ICE: New</span><span class="pill" id="dcState">DataChannel: Closed</span></p>
  </div>

  <div class="card">
    <h3>Available devices</h3>
    <ul id="peers"></ul>
  </div>

  <div class="card">
    <h3>Logs</h3>
    <div id="log"></div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <script>
    // Firebase config — using your regioned Realtime Database
    const firebaseConfig = {
      apiKey: "AIzaSyDh3WZ0lw2m81Oo-_VKJ_Q5786HW67g3O4",
      authDomain: "filesharepro-b7281.firebaseapp.com",
      databaseURL: "https://filesharepro-b7281-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "filesharepro-b7281",
      storageBucket: "filesharepro-b7281.firebasestorage.app",
      messagingSenderId: "173883523630",
      appId: "1:173883523630:web:08d49fd1cacaa9d0c395bf",
      measurementId: "G-GG4CMK1GTX"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ICE servers (STUN + TURN for reliability)
    const iceServers = [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
    ];

    // UI
    const els = {
      name: document.getElementById('displayName'),
      online: document.getElementById('goOnline'),
      offline: document.getElementById('goOffline'),
      peers: document.getElementById('peers'),
      conn: document.getElementById('connState'),
      ice: document.getElementById('iceState'),
      dc: document.getElementById('dcState'),
      log: document.getElementById('log'),
    };

    // State
    const selfId = randId();
    let selfName = '';
    let presenceRef = null;
    const peersRef = db.ref('presence');
    let pc = null;
    let dc = null;
    let roomRef = null;
    let callerCandidatesRef = null;
    let calleeCandidatesRef = null;

    function log(...a){ console.log(...a); els.log.textContent += a.map(x => (typeof x === 'string' ? x : JSON.stringify(x))).join(' ') + '\n'; }
    function setConnState(s){ els.conn.textContent = 'Connection: ' + cap(s); }
    function setIceState(s){ els.ice.textContent = 'ICE: ' + cap(s); }
    function setDcState(s){ els.dc.textContent = 'DataChannel: ' + cap(s); }
    function cap(s){ return s ? s[0].toUpperCase() + s.slice(1) : ''; }

    // Online / Offline
    els.online.addEventListener('click', async () => {
      selfName = (els.name.value.trim() || 'Anonymous');
      presenceRef = db.ref('presence/' + selfId);
      await presenceRef.set({ id:selfId, name:selfName, ts: Date.now() });
      presenceRef.onDisconnect().remove();
      subscribePresence();
      log('Online as', selfName, 'id=', selfId);
    });

    els.offline.addEventListener('click', async () => {
      await goOffline();
    });

    async function goOffline() {
      try { if (presenceRef) await presenceRef.remove(); } catch(e){}
      await cleanupRoom();
      cleanupConnection();
      els.peers.innerHTML = '';
      log('Went offline');
    }

    // Presence list
    function subscribePresence() {
      els.peers.innerHTML = '';
      peersRef.off();
      peersRef.on('child_added', snap => renderPeer(snap.val()));
      peersRef.on('child_changed', snap => renderPeer(snap.val()));
      peersRef.on('child_removed', snap => {
        const el = document.querySelector('[data-peer-id="'+ snap.key +'"]');
        if (el) el.remove();
      });
    }

    function renderPeer(peer){
      if (!peer || peer.id === selfId) return;
      let li = document.querySelector('[data-peer-id="'+ peer.id +'"]');
      if (!li){
        li = document.createElement('li');
        li.dataset.peerId = peer.id;
        li.innerHTML = `<span>${peer.name || 'Unknown'}</span>`;
        const btn = document.createElement('button');
        btn.textContent = 'Connect';
        btn.addEventListener('click', () => connect(peer.id));
        li.appendChild(btn);
        els.peers.appendChild(li);
      } else {
        li.querySelector('span').textContent = peer.name || 'Unknown';
      }
    }

    // Connection
    function roomId(a,b){ return [a,b].sort().join('_'); }

    async function connect(peerId){
      const rid = roomId(selfId, peerId);
      roomRef = db.ref('rooms/' + rid);
      cleanupConnection();

      pc = new RTCPeerConnection({ iceServers });
      pc.onconnectionstatechange = () => setConnState(pc.connectionState);
      pc.oniceconnectionstatechange = () => setIceState(pc.iceConnectionState);

      const isCaller = (selfId < peerId);

      if (isCaller){
        dc = pc.createDataChannel('test');
        wireDc(dc);
      } else {
        pc.ondatachannel = e => { dc = e.channel; wireDc(dc); };
      }
      setDcState(dc ? dc.readyState : 'closed');

      callerCandidatesRef = roomRef.child('callerCandidates');
      calleeCandidatesRef = roomRef.child('calleeCandidates');

      pc.onicecandidate = e => {
        if (!e.candidate) return;
        const tgt = isCaller ? callerCandidatesRef : calleeCandidatesRef;
        tgt.push(e.candidate.toJSON());
      };

      const remoteRef = isCaller ? calleeCandidatesRef : callerCandidatesRef;
      remoteRef.off();
      remoteRef.on('child_added', snap => {
        const cand = snap.val();
        pc.addIceCandidate(new RTCIceCandidate(cand)).catch(err => log('ICE add error:', err.message));
      });

      if (isCaller){
        const offer = await pc.createOffer({ offerToReceiveAudio:false, offerToReceiveVideo:false });
        await pc.setLocalDescription(offer);
        await roomRef.child('offer').set(offer.toJSON());
        log('Offer set. Waiting for answer…');

        roomRef.child('answer').off();
        roomRef.child('answer').on('value', async s => {
          const ans = s.val();
          if (ans && !pc.currentRemoteDescription){
            await pc.setRemoteDescription(new RTCSessionDescription(ans));
            log('Answer applied. Waiting for DataChannel open…');
          }
        });
      } else {
        roomRef.child('offer').off();
        roomRef.child('offer').on('value', async s => {
          const off = s.val();
          if (!off || pc.currentRemoteDescription || pc.currentLocalDescription) return;
          await pc.setRemoteDescription(new RTCSessionDescription(off));
          const ans = await pc.createAnswer();
          await pc.setLocalDescription(ans);
          await roomRef.child('answer').set(ans.toJSON());
          log('Answer created. Waiting for ICE connectivity & DataChannel…');
        });
      }
    }

    function wireDc(dc){
      dc.onopen = () => { setDcState('open'); log('DataChannel open. Sending test message…'); dc.send(JSON.stringify({ hello:'from ' + selfName })); };
      dc.onclose = () => { setDcState('closed'); log('DataChannel closed'); };
      dc.onerror = e => { log('DataChannel error:', e.message); };
      dc.onmessage = e => { log('Received:', e.data); };
    }

    async function cleanupRoom(){
      if (!roomRef) return;
      try {
        await roomRef.child('offer').remove();
        await roomRef.child('answer').remove();
        await roomRef.child('callerCandidates').remove();
        await roomRef.child('calleeCandidates').remove();
      } catch(e){}
      roomRef = null;
    }

    function cleanupConnection(){
      try { if (dc) dc.close(); } catch(e){}
      try { if (pc) pc.close(); } catch(e){}
      dc = null; pc = null;
      setConnState('disconnected');
      setIceState('new');
      setDcState('closed');
    }

    function randId(){
      const a = new Uint8Array(16); crypto.getRandomValues(a);
      return Array.from(a, b => b.toString(16).padStart(2,'0')).join('');
    }
  </script>
</body>
</html>
